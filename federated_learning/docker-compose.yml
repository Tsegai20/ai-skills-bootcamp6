services:

  site_a:
    build: ./site
    container_name: fl_site_a
    environment:
      - SITE_NAME=site_a
      - SITE_CLASS=0
      - DATA_PATH=/data/site_a.csv
    volumes:
      - ./data:/data
    networks:
      - fl_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  site_b:
    build: ./site
    container_name: fl_site_b
    environment:
      - SITE_NAME=site_b
      - SITE_CLASS=1
      - DATA_PATH=/data/site_b.csv
    volumes:
      - ./data:/data
    networks:
      - fl_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  site_c:
    build: ./site
    container_name: fl_site_c
    environment:
      - SITE_NAME=site_c
      - SITE_CLASS=2
      - DATA_PATH=/data/site_c.csv
    volumes:
      - ./data:/data
    networks:
      - fl_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  site_d:
    build: ./site
    container_name: fl_site_d
    environment:
      - SITE_NAME=site_d
      - SITE_CLASS=3
      - DATA_PATH=/data/site_d.csv
    volumes:
      - ./data:/data
    networks:
      - fl_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  aggregator:
    build: ./aggregator
    container_name: fl_aggregator
    ports:
      - "8000:8000"
    environment:
      - SITE_A_URL=http://site_a:8000
      - SITE_B_URL=http://site_b:8000
      - SITE_C_URL=http://site_c:8000
      - SITE_D_URL=http://site_d:8000
      - TEST_DATA_PATH=/data/test.csv
      - MLFLOW_URI=sqlite:////mlflow/mlflow.db
    volumes:
      - ./data:/data
      - ./mlflow:/mlflow
    networks:
      - fl_network
    depends_on:
      site_a:
        condition: service_healthy
      site_b:
        condition: service_healthy
      site_c:
        condition: service_healthy
      site_d:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s

  dashboard:
    build: ./dashboard
    container_name: fl_dashboard
    ports:
      - "8501:8501"
    environment:
      - AGGREGATOR_URL=http://aggregator:8000
      - SITE_A_URL=http://site_a:8000
      - SITE_B_URL=http://site_b:8000
      - SITE_C_URL=http://site_c:8000
      - SITE_D_URL=http://site_d:8000
    networks:
      - fl_network
    depends_on:
      - aggregator

networks:
  fl_network:
    driver: bridge
